[project]
name = "showAndTell-bench"
version = "0.0.1"
description = "Benchmark for teach-by-demonstration agent systems"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "gdown>=5.2,<7",
    "huggingface_hub>=0.34",
    "playwright>=1.44",
    "websockets>=12",
    "edge-tts>=7.2; sys_platform != 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.scripts]
showAndTell = "showAndTell.cli:main"
showAndTell-charts = "showAndTell.benchmark_charts:main"

[project.optional-dependencies]
charts = ["matplotlib>=3.8,<4", "openpyxl>=3.1,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/showAndTell"]

[dependency-groups]
dev = ["pytest>=8", "httpx2>=0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs playwright/chromium",
]
